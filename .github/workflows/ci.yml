name: Go CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Build backend
        working-directory: backend
        run: go build -v ./...

      - name: Validate Docker Compose
        run: docker compose config

  frontend-windows:
    name: Frontend Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: frontend/go.sum

      - name: Test frontend
        working-directory: frontend
        run: go test ./...

      - name: Build frontend exe
        working-directory: frontend
        run: go build -o cliente-sistema.exe .

